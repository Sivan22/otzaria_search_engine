[package]
name = "search_engine"
version = "0.8.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Keep the inference backend opt-in for the application, but make the feature
# boundary explicit: enabling our semantic integration must enable the only
# production embedding backend in the sidecar as well.  The sidecar deliberately
# has no default backend, so omitting this propagation would compile a binary
# that can never serve a semantic query.
semantic = ["semantic-real"]
# Internal gate for code that talks to the sidecar. Both concrete backends turn
# it on; `semantic` remains the backwards-compatible production alias.
semantic-integration = ["dep:otzaria-semantic-search"]
semantic-real = ["semantic-integration", "otzaria-semantic-search/llama-backend"]
# CI and adapter integration tests use the sidecar's deterministic test backend
# without compiling GGUF/llama.cpp. Production builds must use `semantic` (or
# `semantic-real`); neither default nor mock builds can silently select it.
semantic-mock = ["semantic-integration", "otzaria-semantic-search/mock-embedding"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# The search APIs are exposed through flutter_rust_bridge, whose generated
# bindings mirror each function's signature, so wide parameter lists are
# inherent and cannot be bundled into a struct without breaking the bindings.
too_many_arguments = "allow"

[[bin]]
name = "benchmark_cli"
path = "src/bin/benchmark_cli.rs"

# The build-machine entry point for S4b. Compiles in every configuration — without a
# semantic backend it prints why it cannot run rather than failing to exist, so a release
# pipeline discovers the missing feature from the binary instead of from cargo.
[[bin]]
name = "build_semantic_artifact"
path = "src/bin/build_semantic_artifact.rs"

[dependencies]
env_logger = "0.11.10"
flutter_rust_bridge = "=2.13.0"
tempfile = "3.27.0"
tantivy= "=0.26.1"
tantivy-fst = "=0.5.0"
# Same crate/version tantivy 0.26 builds FuzzyTermQuery automatons from, so
# fuzzy highlight-term collection matches the query's term expansion exactly.
levenshtein_automata = "0.2.1"
jieba-rs = "0.10.1"
anyhow = "1.0.102"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
htmlescape = "0.3.1"
log = "0.4.32"
unicode-segmentation = "1.13.3"
# Lexical (MagicDictionary) approximate-search path. `bundled` compiles SQLite
# from source so there is no system libsqlite dependency on Android/iOS.
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.12"
# מקבול הנרמול באינדוקס (add_text_book / add_pdf_book): הנרמול הוא ~85%
# מזמן ה-CPU של הזנת המנוע ואינו תלוי-סדר בין שורות.
rayon = "1.10"
# `corpus_id` is a SHA-256 over the documents an artifact is built from. Same crate and
# major version the semantic sidecar hashes with, so the two sides cannot disagree about
# what SHA-256 means.
sha2 = "0.10"

# The semantic sidecar's persisted-vector format and llama bindings are part of
# the index identity.  A branch dependency can silently change either; pin the
# exact reviewed revision and retain it in Cargo.lock for reproducible builds.
otzaria-semantic-search = { git = "https://github.com/Otzaria/otzaria-semantic-search", rev = "e836ea6cac05e695efdb03ef227e78cd1a624149", optional = true }

[dev-dependencies]
# הידור התבניות שהמודול הזה מחזיר, כדי לבדוק אותן על טקסט אמיתי ולא רק
# להשוות מחרוזות. אותה גרסה שכבר בגרף התלויות של tantivy.
regex = "1.13.1"
# תבניות ההדגשה המשולבות כוללות lookahead (הפרדת תגי inline מתגי שבירה),
# ש-RegExp של Dart תומך בו ו-`regex` לא — בבדיקות מהדרים אותן עם backtracking
# כמו בצד ה-Dart.
fancy-regex = "0.14"

# Vendored copy of tantivy-fst 0.5.0 whose only local change raises the
# regex-DFA STATE_LIMIT from 1 000 to 8 192 (see vendor/tantivy-fst/README.md).
# The patch applies to the whole dependency graph, so tantivy's own
# RegexPhraseQuery compiles against the raised cap too.
[patch.crates-io]
tantivy-fst = { path = "vendor/tantivy-fst" }
